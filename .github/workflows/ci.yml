# Tests for the hook's scripts and the browser extension on each push to main and each pull request. Everything
# runs offline against fixtures; the tests that need node or bun (the shared chat weave) run under bun here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: python3 -m unittest discover -s tests -q
      - working-directory: extension
        run: bun install --frozen-lockfile
      - working-directory: extension
        run: bun test
