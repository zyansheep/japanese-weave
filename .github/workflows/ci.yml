# Tests for the hook's scripts, the browser extension and the Nix package on each push to main and each pull request.
# Everything runs offline against fixtures; the tests that need node or bun (the shared chat weave) run under bun here.
# The Python tests run on the oldest Python scripts/run accepts (3.9) and the newest; `check`, the one main's
# protection requires, passes when every other job did.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.16.10
      # pyflakes' checks: unused imports and variables, undefined names, a test defined twice (the second hides the first)
      - run: ruff check --select F scripts tests tools

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: python3 -m unittest discover -s tests -q

  extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - working-directory: extension
        run: bun install --frozen-lockfile
      - working-directory: extension
        run: bun test

  # The Nix package (flake.nix): it builds, and the Python tests pass against it from the read-only store, as the
  # machines that deploy it through NixOS run it.
  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L

  check:
    needs: [lint, python, extension, nix]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.lint.result }}" = success && test "${{ needs.python.result }}" = success && test "${{ needs.extension.result }}" = success && test "${{ needs.nix.result }}" = success
